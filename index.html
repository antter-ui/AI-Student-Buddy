<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyMate AI</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">🎓</div>

        <h2>AI Student Buddy</h2>

        <button class="nav-btn active">💬 Chat</button>
        <button class="nav-btn">📄 Notes</button>
        <button class="nav-btn">📝 Quiz</button>
        <button class="nav-btn">📅 Planner</button>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <div class="welcome-card">
          <h1>Welcome Vedant 👋</h1>
          <p>Ready to ace your exams?.</p>
        </div>

        <div class="chat-card">
          <button id="clearChat" class="clear-btn">🗑️ Clear Chat</button>

          <div id="messages" class="messages">
            <div class="message ai">
              Hi! Ask me anything about your studies.
            </div>
          </div>

          <div class="input-area">
            <input type="text" id="prompt" placeholder="Ask anything..." />

            <button id="send">Send</button>
          </div>
        </div>
      </main>
    </div>

    <script src="config.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
